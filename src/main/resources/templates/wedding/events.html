<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{wedding/fragments/site :: pageHead('Events · Dhriti &amp; Poojan', 'Explore the five celebrations of Dhriti and Poojan’s wedding in Narmada on 12–13 December 2026.')}"></th:block>
  <link rel="stylesheet" href="/css/wedding-events.css">
  <script src="/js/wedding-events.js" defer></script>
</head>
<body data-page="events">
<a class="skip-link" href="#main" data-i18n="skipMain">Skip to content</a>
<header th:replace="~{wedding/fragments/site :: header}"></header>
<dialog th:replace="~{wedding/fragments/site :: languageDialog}"></dialog>
<main id="main">
  <h1 class="visually-hidden" data-i18n="eventsPageTitle">The celebration unfolds</h1>
  <section class="event-track" data-event-track th:style="|--event-intervals: ${celebrations.size() - 1}|">
    <div class="event-stage" data-event-stage>
      <article class="event-scene" th:each="event, step : ${celebrations}" th:id="${event.key}"
               th:classappend="${step.first} ? ' is-current' : ''">
        <picture class="event-landscape" aria-hidden="true">
          <source media="(max-width: 650px), (orientation: portrait) and (max-width: 950px)"
                  th:srcset="@{|/images/wedding/events/${event.key}-portrait.webp|}">
          <img th:src="@{|/images/wedding/events/${event.key}.webp|}"
               th:attr="fetchpriority=${step.first ? 'high' : 'auto'},loading=${step.index < 2 ? 'eager' : 'lazy'}"
               alt="" width="1536" height="1024" decoding="async">
        </picture>
        <div class="event-inscription">
          <h2 tabindex="-1" th:attr="data-i18n=|${event.key}Name|" th:text="${event.name}"></h2>
          <time th:datetime="${event.startsAt}" th:attr="data-i18n=|${event.key}Time|" th:text="${event.time}"></time>
          <details class="event-placard">
            <summary data-i18n="eventDetails">Details</summary>
            <div>
              <p th:attr="data-i18n=|${event.key}Description|" th:text="${event.description}"></p>
              <p data-i18n="allAtVenue">Every event takes place at Praveg Tent City Narmada, Statue of Unity.</p>
              <a href="https://maps.app.goo.gl/UufZscRbMpX2uvVe8" target="_blank" rel="noopener noreferrer" data-i18n="directions">Get directions</a>
            </div>
          </details>
        </div>
      </article>
      <div class="event-scene-controls">
        <details class="event-schedule">
          <summary><img class="sf-icon" src="/images/wedding/sf/list.bullet.png" alt=""><span data-i18n="eventSchedule">Schedule</span></summary>
          <div class="event-schedule-sheet">
            <ol>
              <li th:each="event, step : ${celebrations}">
                <a th:href="|#${event.key}|" th:attr="aria-current=${step.first ? 'step' : null}" data-event-jump>
                  <strong th:attr="data-i18n=|${event.key}Name|" th:text="${event.name}"></strong>
                  <time th:datetime="${event.startsAt}" th:attr="data-i18n=|${event.key}Time|" th:text="${event.time}"></time>
                </a>
              </li>
            </ol>
            <a class="schedule-calendar" href="/images/wedding/wedding-celebration.ics" download>
              <img class="sf-icon" src="/images/wedding/sf/calendar.png" alt=""><span data-i18n="saveCalendar">Save the dates</span>
            </a>
          </div>
        </details>
        <nav class="event-position" aria-label="Jump to an event" data-i18n-aria="jumpToEvent">
          <a th:each="event, step : ${celebrations}" th:href="|#${event.key}|" data-event-jump
             th:aria-label="${event.type}" th:attr="data-i18n-aria=${event.key},aria-current=${step.first ? 'step' : null}"></a>
        </nav>
        <a class="event-next" href="#mandvo" data-event-next>
          <span data-next-hint data-i18n="nextScene">Next scene</span>
          <span data-rsvp-hint data-i18n="navRsvp" hidden>RSVP</span>
          <img class="sf-icon" src="/images/wedding/sf/arrow.down.png" alt="">
        </a>
      </div>
    </div>
  </section>
</main>
</body>
</html>
