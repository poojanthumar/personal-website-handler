<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${page.title} + ' · ' + ${page.coupleNames}">Wedding</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/wedding.css}">
</head>
<body>
	<div class="frame">
		<header>
			<p class="sanskrit">शुभ विवाह</p>
			<p class="couple" th:text="${page.coupleNames}">Poojan &amp; Partner</p>
			<nav>
				<a href="/">Home</a>
				<a href="/roka">Roka</a>
			</nav>
		</header>
		<main>
			<p class="ornament">✦ ✦ ✦</p>
			<h1 th:text="${page.title}">Title</h1>
			<p class="subtitle" th:text="${page.subtitle}">Subtitle</p>
			<dl class="meta" th:if="${page.eventDate != null or page.venue != null}">
				<div th:if="${page.eventDate}">
					<dt>When</dt>
					<dd th:text="${page.eventDate}">Date</dd>
				</div>
				<div th:if="${page.venue}">
					<dt>Where</dt>
					<dd th:text="${page.venue}">Venue</dd>
				</div>
			</dl>
			<p class="body" th:text="${page.body}">Body</p>
			<p class="extra" th:if="${page.extraCopy}" th:text="${page.extraCopy}">Extra</p>
		</main>
		<footer>
			<p>With love, from both families</p>
		</footer>
	</div>
</body>
</html>
