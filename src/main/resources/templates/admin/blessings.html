<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Wedding responses</title><link rel="stylesheet" href="/css/admin.css"></head><body><div th:replace="~{admin/fragments :: nav}"></div><main class="wrap"><h1>Guestbook moderation</h1><nav><a href="?status=PENDING">Pending</a> · <a href="?status=APPROVED">Approved</a> · <a href="?status=REJECTED">Rejected</a></nav><p>Only approved messages are public. Return a message to Pending to remove it from the public wall.</p><article th:each="row : ${page.content}"><h2 th:text="${row.name}"></h2><p th:text="${row.relation}"></p><p style="white-space:pre-wrap" th:text="${row.message}"></p><small th:text="${row.receivedAt}"></small><form method="post" th:action="@{|/explorer/blessings/${row.id}/moderate|}"><select name="status" aria-label="Moderation decision"><option value="PENDING" th:selected="${row.status == 'PENDING'}">Pending</option><option value="APPROVED" th:selected="${row.status == 'APPROVED'}">Approved</option><option value="REJECTED" th:selected="${row.status == 'REJECTED'}">Rejected</option></select><button type="submit">Save decision</button></form></article><p th:if="${page.empty}">No messages in this queue.</p><nav class="pager" th:if="${page.totalPages > 1}"><a th:if="${page.hasPrevious()}" th:href="@{/explorer/blessings(page=${page.number - 1},status=${status})}">Previous</a><span th:text="${page.number + 1}"></span><a th:if="${page.hasNext()}" th:href="@{/explorer/blessings(page=${page.number + 1},status=${status})}">Next</a></nav></main></body></html>
