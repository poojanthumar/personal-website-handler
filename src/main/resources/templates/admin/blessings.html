<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guestbook · Wedding admin</title>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<nav th:replace="~{admin/fragments :: nav}"></nav>
<main class="wrap wedding-admin">
  <header>
    <h1>Wedding guestbook</h1>
    <p class="muted">Choose which blessings appear on the invitation.</p>
    <nav class="wedding-admin-tabs" aria-label="Wedding responses">
      <a href="/wedding/rsvps">Guest list</a>
      <a href="/wedding/blessings" aria-current="page">Guestbook</a>
    </nav>
  </header>
  <nav class="wedding-admin-tabs guestbook-queues" aria-label="Guestbook queues">
    <a href="?status=PENDING" th:attr="aria-current=${status == 'PENDING' ? 'page' : null}">Pending</a>
    <a href="?status=APPROVED" th:attr="aria-current=${status == 'APPROVED' ? 'page' : null}">Published</a>
    <a href="?status=REJECTED" th:attr="aria-current=${status == 'REJECTED' ? 'page' : null}">Hidden</a>
  </nav>
  <p th:if="${page.empty}" class="wedding-admin-empty">No messages in this queue.</p>
  <section aria-label="Blessings">
    <article class="admin-blessing" th:each="row : ${page.content}">
      <h2 th:text="${row.name}" dir="auto"></h2>
      <p th:if="${row.relation}" th:text="${row.relation}" dir="auto"></p>
      <p class="admin-message" th:text="${row.message}" dir="auto"></p>
      <form method="post" th:action="@{|/wedding/blessings/${row.id}/moderate|}">
        <input type="hidden" name="queue" th:value="${status}">
        <button type="submit" name="status" value="APPROVED" th:if="${row.status != 'APPROVED'}">Publish blessing</button>
        <button type="submit" name="status" value="REJECTED" th:if="${row.status != 'REJECTED'}" class="secondary-admin-button">Hide blessing</button>
        <button type="submit" name="status" value="PENDING" th:if="${row.status != 'PENDING'}" class="secondary-admin-button">Return to pending</button>
      </form>
    </article>
  </section>
  <nav class="pager" th:if="${page.totalPages > 1}" aria-label="Guestbook pages">
    <a th:if="${page.hasPrevious()}" th:href="@{/wedding/blessings(page=${page.number - 1},status=${status})}">Previous</a>
    <span th:text="${page.number + 1}"></span>
    <a th:if="${page.hasNext()}" th:href="@{/wedding/blessings(page=${page.number + 1},status=${status})}">Next</a>
  </nav>
</main>
</body>
</html>
