<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Wedding responses</title><link rel="stylesheet" href="/css/admin.css"></head><body><div th:replace="~{admin/fragments :: nav}"></div><main class="wrap"><h1>Wedding RSVPs</h1><p>Private contact details and responses for all celebrations.</p><table><thead><tr><th>Received</th><th>Guest / family</th><th>Attendance</th><th>Party size</th><th>Contact</th><th>Private message</th></tr></thead><tbody><tr th:each="row : ${page.content}"><td th:text="${row.receivedAt}"></td><td><strong th:text="${row.name}"></strong><p th:text="${row.familyName}"></p></td><td th:text="${row.attendance}"></td><td th:text="${row.partySize}"></td><td><p th:text="${row.phone}"></p><p th:text="${row.email}"></p></td><td style="white-space:pre-wrap" th:text="${row.blessing}"></td></tr></tbody></table><p th:if="${page.empty}">No RSVPs yet.</p><nav class="pager" th:if="${page.totalPages > 1}"><a th:if="${page.hasPrevious()}" th:href="@{/explorer/rsvps(page=${page.number - 1})}">Previous</a><span th:text="${page.number + 1}"></span><a th:if="${page.hasNext()}" th:href="@{/explorer/rsvps(page=${page.number + 1})}">Next</a></nav></main></body></html>
