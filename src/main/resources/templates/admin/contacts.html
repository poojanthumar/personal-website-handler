<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Contact messages</title>
	<link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
	<div th:replace="~{admin/fragments :: nav}"></div>
	<main class="wrap">
		<h1>Contact messages</h1>
		<p class="ok" th:if="${notice}" th:text="${notice}"></p>
		<p class="err" th:if="${error}" th:text="${error}"></p>
		<p><a class="button" href="/explorer/contacts/new">Create</a></p>
		<table>
			<thead>
				<tr>
					<th>Received</th>
					<th>Name</th>
					<th>Email</th>
					<th>Message</th>
					<th></th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="row : ${page.content}">
					<td th:text="${row.receivedAt}">time</td>
					<td th:text="${row.name}">name</td>
					<td th:text="${row.email}">email</td>
					<td class="clip" th:text="${row.message}">msg</td>
					<td><a th:href="@{|/explorer/contacts/${row.id}|}">Edit</a></td>
				</tr>
			</tbody>
		</table>
		<nav class="pager" th:if="${page.totalPages > 1}">
			<a th:if="${page.hasPrevious()}" th:href="@{/explorer/contacts(page=${page.number - 1})}">Previous</a>
			<span th:text="${page.number + 1} + ' / ' + ${page.totalPages}"></span>
			<a th:if="${page.hasNext()}" th:href="@{/explorer/contacts(page=${page.number + 1})}">Next</a>
		</nav>
	</main>
</body>
</html>
