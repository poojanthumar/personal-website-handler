spring.application.name=personal-website-handler
server.port=8080

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Local default: in-memory H2 (PostgreSQL compatibility mode). Oracle/Postgres is not required.
spring.datasource.url=jdbc:h2:mem:website;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.thymeleaf.cache=false

# Never commit a real password. Override with ADMIN_USER / ADMIN_PASSWORD.
app.admin.username=${ADMIN_USER:admin}
app.admin.password=${ADMIN_PASSWORD:change-me}

app.hosts.www=www.poojanthumar.in,www.localhost,localhost,127.0.0.1
app.hosts.wedding=wedding.poojanthumar.in,wedding.localhost
app.hosts.admin=admin.poojanthumar.in,admin.localhost

app.contact.max-requests=5
app.contact.rate-limit-window=10m
