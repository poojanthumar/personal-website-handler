# File-backed H2 so local data survives restarts. Still no Oracle DB required.
spring.datasource.url=jdbc:h2:file:./data/website;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Extra local Host aliases (also listed in application.properties).
app.hosts.www=www.poojanthumar.in,www.localhost,localhost,127.0.0.1
app.hosts.wedding=wedding.poojanthumar.in,wedding.localhost
app.hosts.admin=admin.poojanthumar.in,admin.localhost
