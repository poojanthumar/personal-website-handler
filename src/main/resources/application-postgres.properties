# Activate with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/website}
spring.datasource.username=${DATABASE_USER:website}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
